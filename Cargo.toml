[package]
name = "mofi"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mofi"
path = "src/main.rs"

[[bin]]
name = "mofisw"
path = "src/switcher/main.rs"

[dependencies]
egui = "0.27"
fuzzy-matcher = "0.3"
walkdir = "2"
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
signal-hook = "0.3"
libc = "0.2"
shellexpand = "3"

[target.'cfg(target_os = "macos")'.dependencies]
eframe = { version = "0.27", features = ["default"] }
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSRunningApplication", "NSWorkspace"] }
core-foundation = "0.10"
core-graphics = { version = "0.25", features = ["highsierra"] }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.2"
fontdue = "0.9"
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
smithay-client-toolkit = { version = "0.18", features = ["calloop"] }
wayland-backend = { version = "0.3", features = ["client_system", "raw-window-handle"] }
wayland-protocols = { version = "0.31", features = ["client"] }
egui_glow = { version = "0.27", default-features = false }
glutin = { version = "0.31", default-features = false, features = ["egl", "wayland"] }
glow = "0.13"
raw-window-handle = "0.5"
log = "0.4"
env_logger = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Patch winit to remove the sctk-adwaita CSD frame from its default features.
# Without this, winit draws an Adwaita border around the window on Wayland even
# when with_decorations(false) is set — because "no decorations" in Wayland means
# "client-side decorations", which triggers sctk-adwaita.
[patch.crates-io]
winit = { path = "../winit-0.29.15-nocsd" }
